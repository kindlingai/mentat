\* Four daemons and three crashes. scripts/check-spec also checks the bug
\* variant. A cluster that has agreed and has no crashes left has nothing to
\* do, which is not a deadlock.
SPECIFICATION Spec
CONSTANTS
    N = 4
    MaxRestarts = 3
    BugNoBootWait = FALSE
INVARIANTS TypeOK
PROPERTIES StableHead Converges
CHECK_DEADLOCK FALSE
