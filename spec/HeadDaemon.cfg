\* The default model: 2 drivers, 2 devices, 1 daemon restart and a reap
\* grace, with claims and the restart outage off. scripts/check-spec derives
\* every other check from this file.
SPECIFICATION Spec
CONSTANTS
    Clients = {d1, d2}
    Gpus = {g1, g2}
    MaxPgs = 2
    MaxRestarts = 1
    NoClient = NoClient
    NoGpu = NoGpu
    GraceDeferred = TRUE
    ModelClaims = FALSE
    ModelOutage = FALSE
    DriverGpu = g2
    BugAccountPgsOnly = FALSE
    BugNoPlaceOnExit = FALSE
    BugNoOrphanReap = FALSE
    BugKillDuringGrace = FALSE
    BugReapReconnected = FALSE
    BugStaleTimer = FALSE
    BugClaimSpill = FALSE
    BugClaimKept = FALSE
    BugNoRotate = FALSE
    BugNoRedial = FALSE
    BugUnknownRefReady = FALSE
INVARIANTS TypeOK NoDoubleAlloc ClaimFence ClaimHeld RankZeroOnDriver NoFalseDeath
PROPERTIES NoStall GraceHoldsActors SessionKeepsActors AdoptedBecomeKnown
