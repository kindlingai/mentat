.t{fill:#1f2328;font:12px sans-serif;text-anchor:middle;dominant-baseline:central}
.c{fill:#57606a;font:11px sans-serif;text-anchor:middle}
.l{stroke:#57606a;stroke-width:2;fill:none}
.sw{stroke:#0969da;stroke-width:2;fill:none}
.cb{stroke:#bc4c00;stroke-width:3;fill:none}
.d{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.box{fill:#f6f8fa;stroke:#0969da;stroke-width:1.5}
.g{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:3 3}
@media (prefers-color-scheme: dark){
.n{fill:#0d1117;stroke:#9198a1}
