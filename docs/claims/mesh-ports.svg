.sw{stroke:#4493f8}
.cb{stroke:#f0883e}
.d{stroke:#656c76}
.box{fill:#161b22;stroke:#4493f8}
.g{stroke:#656c76}
}
</style><rect class="box" x="90" y="65" width="60" height="30" rx="4"/><text class="t" x="120" y="80">switch</text><line class="sw" x1="35" y1="35" x2="90" y2="70"/><line class="sw" x1="35" y1="125" x2="90" y2="90"/><line class="sw" x1="205" y1="125" x2="150" y2="90"/><line class="sw" x1="205" y1="35" x2="150" y2="70"/><line class="g" x1="35" y1="35" x2="35" y2="125"/><circle class="n" cx="35" cy="35" r="15"/><text class="t" x="35" y="35">0</text><circle class="n" cx="35" cy="125" r="15"/><text class="t" x="35" y="125">1</text><circle class="n" cx="205" cy="125" r="15"/><text class="t" x="205" y="125">2</text><circle class="n" cx="205" cy="35" r="15"/><text class="t" x="205" y="35">3</text><text class="c" x="120" y="158">mesh, ports: same (default)</text><text class="c" x="57" y="84"></text><rect class="box" x="330" y="65" width="60" height="30" rx="4"/><text class="t" x="360" y="80">switch</text><line class="sw" x1="275" y1="35" x2="330" y2="70"/><line class="sw" x1="275" y1="125" x2="330" y2="90"/><line class="sw" x1="445" y1="125" x2="390" y2="90"/><line class="sw" x1="445" y1="35" x2="390" y2="70"/><line class="cb" x1="275" y1="35" x2="275" y2="125"/><circle class="n" cx="275" cy="35" r="15"/><text class="t" x="275" y="35">0</text><circle class="n" cx="275" cy="125" r="15"/><text class="t" x="275" y="125">1</text><circle class="n" cx="445" cy="125" r="15"/><text class="t" x="445" y="125">2</text><circle class="n" cx="445" cy="35" r="15"/><text class="t" x="445" y="35">3</text><text class="c" x="360" y="158">mesh, ports: split</text><text class="c" x="297" y="84">0-1</text></svg>
