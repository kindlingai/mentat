name: release

# Pushing a v* tag (v0.20.0) runs the tests, then publishes:
#   - ghcr.io/kindlingai/{mentat-artifacts,mentatd,mentatd-serve,mentat}:<version>
#     for linux/amd64 and linux/arm64, and the same images on Docker Hub
#     under mmastrac/
#   - a GitHub release with static linux amd64/arm64 binaries, the shim wheel
#     and SHA256SUMS, pre-release if the version has a suffix (v0.20.0-rc.1)
# latest does not move here. Run latest.yml with the version to promote.
# Running this by hand publishes a tag pushed earlier, such as one from before
# this workflow existed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, such as v0.19.0"
        required: true

permissions:
  contents: write
  packages: write

# One release at a time: they share the staging tags.
concurrency:
  group: release

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  HUB: docker.io/mmastrac
  IMAGES: mentat-artifacts mentatd mentatd-serve mentat

jobs:
  tag:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "not a version tag: $TAG" >&2; exit 1 ;;
          esac
          case "${TAG#v}" in
            *[!0-9A-Za-z.-]*) echo "not a version tag: $TAG" >&2; exit 1 ;;
          esac
          git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "refs/tags/$TAG" > /dev/null || { echo "no such tag: $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: tag
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  # Builds alongside the tests. It pushes only staging tags, so nothing is
  # published until both pass.
  image:
    needs: tag
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      publish: true

  join:
    needs: [tag, test, image]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: build/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Join the architectures under the version tag
        run: |
          v=${TAG#v}
          for i in $IMAGES; do
            docker buildx imagetools create -t "$REGISTRY/$i:$v" \
              "$(cat "build/build-amd64/digests/$i")" "$(cat "build/build-arm64/digests/$i")"
            docker buildx imagetools inspect "$REGISTRY/$i:$v" | grep Platform
          done

  # Each architecture runs on its own runner. QEMU on the amd64 runner
  # cannot start the arm64 image: exec reports "exec format error".
  check:
    needs: [tag, join]
    name: check / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-2vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check the version tag runs here and reports the tag
        run: |
          v=${TAG#v}
          arch=${{ matrix.arch }}
          got=$(docker run --rm --pull always --platform "linux/$arch" "$REGISTRY/mentatd:$v" --version)
          echo "mentatd $arch: $got"
          [ "$got" = "mentatd $v" ]
          got=$(docker run --rm --pull always --platform "linux/$arch" "$REGISTRY/mentat-artifacts:$v" /out/mentatd --version)
          echo "mentat-artifacts $arch: $got"
          [ "$got" = "mentatd $v" ]

  publish:
    needs: [tag, check]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: build/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The copy is the joined image, so Docker Hub gets no architecture
      # tags to clean up.
      - name: Copy the images to Docker Hub
        run: |
          v=${TAG#v}
          for i in $IMAGES; do
            docker buildx imagetools create -t "$HUB/$i:$v" "$REGISTRY/$i:$v"
            docker buildx imagetools inspect "$HUB/$i:$v" | grep Platform
          done
      - name: Publish the release
        run: |
          v=${TAG#v}
          mkdir dist
          cp build/build-*/dist/* dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          {
            echo "Images, each for linux/amd64 and linux/arm64:"
            echo
            for i in $IMAGES; do
              d=$(docker buildx imagetools inspect --raw "$REGISTRY/$i:$v" | sha256sum | cut -d' ' -f1)
              echo "- \`$REGISTRY/$i:$v@sha256:$d\`"
            done
            echo
            echo "The same images are on Docker Hub as \`$HUB/<image>:$v\`."
          } > notes.md
          cat notes.md
          # A rerun replaces the assets of the release it made the first time.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            pre=false
            case "$v" in *-*) pre=true ;; esac
            gh release create "$TAG" dist/* --verify-tag --prerelease="$pre" \
              --title "$TAG" --generate-notes --notes-file notes.md
          fi
